name: Update YouTube Live Grid

on:
  schedule:
    # Roda a cada 10 minutos (limite seguro e gratuito do GitHub Actions)
    - cron: '*/10 * * * *'
  workflow_dispatch: # Permite rodar manualmente pelo painel do GitHub
  push:
    branches:
      - main
      - master

jobs:
  update-grid:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Install dependencies
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci

      - name: Run monitor to update lives
        env:
          GITHUB_ACTIONS: 'true'
        run: node monitor.js

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add lives.json
          # Só faz commit e push se houver mudanças no arquivo lives.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update live streams [skip ci]" && git push)
